name: Orchard Core Contrib Library

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build windows-latest
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.*
    - name: Install Dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal

    - name: Checkout OrchardCoreContrib.App Repository
      uses: actions/checkout@v6
      with: 
          repository: OrchardCoreContrib/OrchardCoreContrib.App
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          submodules: true
    - name:  Update submodules  
      run: |
        git submodule update --init --recursive
        git submodule update --recursive --remote

    - name: Commit and push changes
      env:
        TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add --all
        git commit -m "Update submodules" || echo "No changes to commit"
        git remote set-url origin https://x-access-token:${TOKEN}@github.com/OrchardCoreContrib/OrchardCoreContrib.App.git
        git push origin HEAD:main
